[package]
name = "pos-tauri"
version = "0.1.0"
description = "POS Billing Desktop App"
authors = []
edition = "2021"
rust-version = "1.65"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "http-all",
  "shell-open",
  "dialog-all",
  "fs-all",
  "path-all",
  "window-all"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
urlencoding = "2"
open = "5"
dirs = "5"
base64 = "0.22"
zip = "2"
flate2 = "1"
bcrypt = "0.15"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
